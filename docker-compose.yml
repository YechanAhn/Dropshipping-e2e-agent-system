version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://dropagent:${POSTGRES_PASSWORD:-dropagent_dev_2024}@postgres:5432/dropagent
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dropagent

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dropagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dropagent_dev_2024}
      POSTGRES_DB: dropagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropagent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dropagent

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dropagent

volumes:
  pgdata:
  redisdata:

networks:
  dropagent:
    driver: bridge
