[project]
name = "dropagent"
version = "0.1.0"
description = "Dropshipping E2E Agent System - AliExpress to Naver SmartStore"
readme = "docs/PRD.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",

    # LLM & Agent
    "langgraph>=0.2",
    "anthropic>=0.40",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",

    # Cache & Queue
    "redis>=5.0",

    # Scheduler
    "apscheduler>=3.10",

    # Browser Automation (Phase 3)
    # "nodriver>=0.30",

    # Messaging
    "python-telegram-bot>=21.0",

    # Dashboard (Phase 1: Streamlit)
    "streamlit>=1.38",

    # API Server (Phase 4)
    "fastapi>=0.115",
    "uvicorn>=0.30",

    # Utilities
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dropagent"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
